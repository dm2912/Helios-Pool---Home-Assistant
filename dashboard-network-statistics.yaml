    heading: Bitcoin
    heading_style: title
  - type: entities
    show_header_toggle: false
    entities:
      - entity: sensor.bitcoin
        name: Coin
        icon: mdi:currency-usd
      - entity: sensor.btc_network_difficulty
        name: Network Difficulty
        icon: mdi:gauge
      - entity: sensor.btc_block_reward
        name: Block Reward
        icon: mdi:cube-outline
      - entity: sensor.btc_reward_usd
        name: Reward USD
        icon: mdi:cash
      - entity: sensor.btc_price_change_24h
        name: Price Change (24h)
        icon: mdi:chart-line
    - type: heading
    heading: Bitcoin
    heading_style: title
  - type: entities
    show_header_toggle: false
