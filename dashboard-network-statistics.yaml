#monitoring for Cheetah, Digibyte, Bitcoin Cash and Bitcoin
type: vertical-stack
cards:
  - type: heading
    heading: Cheetah Network
    heading_style: title
  - type: entities
    show_header_toggle: false
    entities:
      - entity: sensor.chta_coin
        name: Coin
        icon: mdi:currency-usd
      - entity: sensor.chta_network_difficulty
        name: Network Difficulty
        icon: mdi:gauge
      - entity: sensor.chta_block_reward
        name: Block Reward
        icon: mdi:cube-outline
      - entity: sensor.chta_reward_usd
        name: Reward USD
        icon: mdi:cash
      - entity: sensor.chta_price_change_24h
        name: Price Change (24h)
        icon: mdi:chart-line
  - type: heading
    heading: Bitcoin Cash
    heading_style: title
  - type: entities
    show_header_toggle: false
    entities:
      - entity: sensor.bitcoin_cash
        name: Coin
        icon: mdi:currency-usd
      - entity: sensor.bch_network_difficulty
        name: Network Difficulty
        icon: mdi:gauge
      - entity: sensor.bch_block_reward
        name: Block Reward
        icon: mdi:cube-outline
      - entity: sensor.bch_reward_usd
        name: Reward USD
        icon: mdi:cash
      - entity: sensor.bch_price_change_24h
        name: Price Change (24h)
        icon: mdi:chart-line
