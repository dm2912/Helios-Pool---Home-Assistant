# Bitcoin Cash (BCH) — Home Assistant configuration
# Add these entries to configuration.yaml. If rest: or template: already exists,
# merge the entries into those sections rather than duplicating the keys.
# Set bch_api_url in secrets.yaml to your wallet API URL.
# Worker IDs below are examples, dont forget to use your own.

# >> If you already have a "rest" section then place this next part there <<
rest:

# Fetching your personal Helios Pool stats and workers for Bitcoin Cash (refreshes every 60 seconds)
  - resource: !secret bch_api_url
    scan_interval: 60
    sensor:
      - name: "BCH Hashrate 5m"
        unique_id: bch_hashrate_5m
        value_template: >
          {{ (value_json.user.workers
             | map(attribute='hashrate5m')
             | sum / 1000000) | round(3) }}
        unit_of_measurement: "MH/s"
        state_class: measurement

      - name: "BCH Hashrate 1h"
        unique_id: bch_hashrate_1h
        value_template: >
          {{ (value_json.user.workers
             | map(attribute='hashrate1hr')
             | sum / 1000000) | round(3) }}
        unit_of_measurement: "MH/s"
        state_class: measurement

      - name: "BCH Hashrate 24h"
        unique_id: bch_hashrate_24h
        value_template: >
          {{ (value_json.user.workers
             | map(attribute='hashrate1d')
             | sum / 1000000) | round(3) }}
        unit_of_measurement: "MH/s"
        state_class: measurement

      - name: "BCH Hashrate 7d"
        unique_id: bch_hashrate_7d
        value_template: >
          {{ (value_json.user.workers
             | map(attribute='hashrate7d')
             | sum / 1000000) | round(3) }}
        unit_of_measurement: "MH/s"
        state_class: measurement

      - name: "BCH Active Workers"
        unique_id: bch_active_workers
        value_template: >
          {{ value_json.user.workers
             | selectattr('hashrate5m', 'gt', 0)
             | list | count }}

      - name: "BCH Blocks Found"
        unique_id: bch_blocks_found
        value_template: >
          {{ value_json.get('blocks', [])
             | selectattr('status', 'eq', 'confirmed')
             | list | count }}
        icon: mdi:cube-outline
        state_class: measurement

      # DEFINE YOUR WORKER(S)

      # Worker 1: replace the ID in both locations for another worker
      - name: "BCH Worker One"
        unique_id: bch_worker_one
        value_template: >
          {% set w = value_json.user.workers
             | selectattr('id', 'eq', 40876022)
             | first | default(none) %}
          {{ w.name if w is not none else 'unavailable' }}
        json_attributes_path: "$.user.workers[?(@.id==40876022)]"
        json_attributes:
          - bestShare
          - bestEver
          - lastUpdate

      # Worker 2: replace the ID in both locations for another worker
      - name: "BCH Worker Two"
        unique_id: bch_worker_two
        value_template: >
          {% set w = value_json.user.workers
             | selectattr('id', 'eq', 75856619)
             | first | default(none) %}
          {{ w.name if w is not none else 'unavailable' }}
        json_attributes_path: "$.user.workers[?(@.id==75856619)]"
        json_attributes:
          - bestShare
          - bestEver
          - lastUpdate

# Fetching the global HeliosPool BCH Network Statistics (updates every 10 minutes)

  - resource: "https://heliospool.com/wp-json/heliospool/v1/network?coin=bch"
    scan_interval: 600
    sensor:
      - name: "BCH Coin"
        unique_id: bch_network_coin
        value_template: >
          {{ value_json.coin | upper }}
        icon: mdi:currency-usd

      - name: "BCH Network Difficulty"
        unique_id: bch_network_difficulty
        value_template: >
          {{ value_json.difficulty_human }}
        icon: mdi:gauge

      - name: "BCH Block Reward"
        unique_id: bch_network_block_reward
        value_template: >
          {{ value_json.block_reward | float(0) | round(2) }}
        unit_of_measurement: "BCH"
        icon: mdi:cube-outline

      - name: "BCH Reward USD"
        unique_id: bch_network_reward_usd
        value_template: >
          {{ value_json.reward_usd | float(0) | round(8) }}
        unit_of_measurement: "USD"
        icon: mdi:cash

      - name: "BCH Price Change 24h"
        unique_id: bch_network_price_change_24h
        value_template: >
          {{ value_json.price_change_24h | float(0) | round(2) }}
        unit_of_measurement: "%"
        icon: mdi:chart-line
        state_class: measurement

# >> This goes in a seperate "template" section <<

# Timestamp sensors: use format: relative in the dashboard to show "x minutes ago".

template:
  - sensor:
      - name: "BCH Worker One Last Seen"
        unique_id: bch_worker_one_last_seen
        device_class: timestamp
        state: >
          {{ state_attr('sensor.bch_worker_one',
                        'lastUpdate') | default(none, true) }}

      - name: "BCH Worker Two Last Seen"
        unique_id: bch_worker_two_last_seen
        device_class: timestamp
        state: >
          {{ state_attr('sensor.bch_worker_two',
                        'lastUpdate') | default(none, true) }}
