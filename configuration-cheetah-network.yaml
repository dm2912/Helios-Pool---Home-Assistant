  # HeliosPool CHTA Network Statistics
  - resource: "https://heliospool.com/wp-json/heliospool/v1/network?coin=chta"
    scan_interval: 60
    sensor:
      - name: "CHTA Coin"
        unique_id: chta_network_coin
        value_template: >
          {{ value_json.coin | upper }}
        icon: mdi:currency-usd

      - name: "CHTA Network Difficulty"
        unique_id: chta_network_difficulty
        value_template: >
          {{ value_json.difficulty_human }}
        icon: mdi:gauge

      - name: "CHTA Block Reward"
        unique_id: chta_network_block_reward
        value_template: >
          {{ value_json.block_reward | float(0) | round(2) }}
        unit_of_measurement: "CHTA"
        icon: mdi:cube-outline

      - name: "CHTA Reward USD"
        unique_id: chta_network_reward_usd
        value_template: >
          {{ value_json.reward_usd | float(0) | round(2) }}
        unit_of_measurement: "USD"
        icon: mdi:cash

      - name: "CHTA Price Change 24h"
        unique_id: chta_network_price_change_24h
        value_template: >
          {{ value_json.price_change_24h | float(0) | round(2) }}
        unit_of_measurement: "%"
        icon: mdi:chart-line
        state_class: measurement
